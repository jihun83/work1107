<!doctype html>
<!-- 보석 맞추기 v1.1 · 2026-11-07 · 파일 하나로 도는 3매치 퍼즐 (2×2 사각형 맞추기 추가) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보석 맞추기</title>
<style>
:root{--text:#f3f0ff;--sub:#b8b0e0;--panel:#2a2547;--accent:#ffcc4d;--cell:56px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3a2f6b,#15122a 70%) fixed;color:var(--text);
  font-family:system-ui,"Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;
  user-select:none;-webkit-user-select:none}
h1{margin:4px 0 12px;font-size:1.6rem;letter-spacing:2px}
h1 small{font-size:.7rem;color:var(--sub);letter-spacing:0;margin-left:6px}
.wrap{width:calc(var(--cell)*8 + 16px)}
.hud{display:flex;gap:8px;margin-bottom:8px}
.stat{flex:1;background:var(--panel);border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--accent)}
.stat span{font-size:.75rem;color:var(--sub)}
.timebar{height:10px;background:#0f0d1f;border-radius:5px;overflow:hidden;margin-bottom:10px}
.timebar div{height:100%;width:100%;background:linear-gradient(90deg,#4dd0e1,#7c4dff);transition:width .1s linear}
.timebar.low div{background:linear-gradient(90deg,#ff5252,#ff9100)}
#board{position:relative;width:100%;aspect-ratio:1;padding:8px;background:#0f0d1f;border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 0 2px #3b3466;touch-action:none;overflow:hidden}
#layer{position:absolute;inset:8px;
  background:conic-gradient(#262044 25%,#1b1733 0 50%,#262044 0 75%,#1b1733 0);
  background-size:calc(var(--cell)*2) calc(var(--cell)*2);border-radius:6px}
.gem{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);padding:calc(var(--cell)*.06);transition:transform .22s ease;cursor:pointer}
.gem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55));transition:transform .2s,opacity .2s}
.gem.sel{z-index:2}
.gem.sel svg{animation:bob .45s infinite alternate}
.gem.pop svg{transform:scale(1.4) rotate(30deg);opacity:0}
.gem.hint svg{animation:pulse .35s 6 alternate}
@keyframes bob{to{transform:scale(1.12)}}
@keyframes pulse{to{transform:scale(1.25);filter:brightness(1.6) drop-shadow(0 0 6px #fff)}}
.float{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:var(--accent);
  text-shadow:0 2px 0 #7a4b00,0 0 12px rgba(255,204,77,.7);pointer-events:none;animation:up 1s forwards;z-index:5;white-space:nowrap}
@keyframes up{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}to{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.btns{display:flex;gap:8px;margin-top:10px}
button{flex:1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;color:#1b1830;background:var(--accent);cursor:pointer}
button.alt{background:#4a4280;color:var(--text)}
button:active{transform:translateY(1px)}
#over{position:absolute;inset:0;background:rgba(10,8,25,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;border-radius:14px}
#over.show{display:flex}
#over h2{margin:0;font-size:1.8rem}
#over p{margin:0;color:var(--sub)}
#over button{flex:none;padding:10px 28px}
.help{font-size:.8rem;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<!-- 보석 색 그라데이션(모든 보석 SVG가 같이 쓴다) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div class="wrap">
  <h1>💎 보석 맞추기<small>v1.1</small></h1>
  <div class="hud">
    <div class="stat"><span>점수</span><b id="score">0</b></div>
    <div class="stat"><span>최고</span><b id="best">0</b></div>
    <div class="stat"><span>남은 시간</span><b id="time">90</b></div>
  </div>
  <div class="timebar" id="timebar"><div id="timefill"></div></div>
  <div id="board">
    <div id="layer"></div>
    <div id="over">
      <h2>시간 종료!</h2>
      <p id="overScore"></p>
      <button id="again">다시 하기</button>
    </div>
  </div>
  <div class="btns">
    <button class="alt" id="hintBtn">💡 힌트 (-50점)</button>
    <button id="newBtn">🔄 새 게임</button>
  </div>
  <div class="help">이웃한 보석을 끌거나 두 번 눌러 자리를 바꾸세요.<br>같은 보석 3개 이상을 줄 세우거나 2×2 사각형으로 모으면 사라집니다. 연쇄되면 콤보 점수!</div>
</div>

<script>
const VERSION = '1.1';
const N = 8;            // 판 크기
const TYPES = 7;        // 보석 종류
const GAME_SEC = 90;    // 제한 시간(초)

// ---------- 보석 그림 ----------
const COLORS = [
  ['#ff8a8a', '#b3121f', '#7a0a14'], // 빨강
  ['#ffc46b', '#d0600c', '#8a3c05'], // 주황
  ['#fff59a', '#d4ad00', '#8a7000'], // 노랑
  ['#8dffa0', '#169a32', '#0b5c1d'], // 초록
  ['#9de2ff', '#1a6fd0', '#0d3f7a'], // 파랑
  ['#eaa8ff', '#8a24b8', '#4f0f6b'], // 보라
  ['#ffffff', '#a6aec0', '#5d6475'], // 하양
];
const SHAPES = [
  // 0 빨강: 둥근 사각
  { outer: '<rect x="10" y="10" width="80" height="80" rx="16"/>',
    inner: '<rect x="28" y="28" width="44" height="44" rx="6"/>' },
  // 1 주황: 육각
  { outer: '<polygon points="50,5 91,28 91,72 50,95 9,72 9,28"/>',
    inner: '<polygon points="50,25 72,38 72,62 50,75 28,62 28,38"/>' },
  // 2 노랑: 마름모
  { outer: '<polygon points="50,4 96,50 50,96 4,50"/>',
    inner: '<polygon points="50,26 74,50 50,74 26,50"/>' },
  // 3 초록: 팔각
  { outer: '<polygon points="31,6 69,6 94,31 94,69 69,94 31,94 6,69 6,31"/>',
    inner: '<polygon points="40,28 60,28 72,40 72,60 60,72 40,72 28,60 28,40"/>' },
  // 4 파랑: 브릴리언트 컷
  { outer: '<polygon points="24,12 76,12 96,38 50,94 4,38"/>',
    inner: '<polygon points="34,22 66,22 76,38 50,72 24,38"/>' },
  // 5 보라: 삼각
  { outer: '<polygon points="50,6 96,90 4,90"/>',
    inner: '<polygon points="50,34 74,78 26,78"/>' },
  // 6 하양: 둥근 보석
  { outer: '<circle cx="50" cy="50" r="44"/>',
    inner: '<polygon points="50,24 68,32 76,50 68,68 50,76 32,68 24,50 32,32"/>' },
];
(function buildDefs() {
  let html = '<linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>';
  COLORS.forEach((c, i) => {
    html += `<linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1">` +
      `<stop offset="0" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient>`;
  });
  document.getElementById('defs').innerHTML = html;
})();
const SVGS = SHAPES.map((s, i) =>
  `<svg viewBox="0 0 100 100">` +
  `<g fill="url(#g${i})" stroke="${COLORS[i][2]}" stroke-width="3">${s.outer}</g>` +
  `<g fill="${COLORS[i][1]}" opacity=".55">${s.inner}</g>` +
  `<g fill="url(#hi)" opacity=".7">${s.inner}</g>` +
  `<ellipse cx="36" cy="30" rx="10" ry="5" fill="#fff" opacity=".75" transform="rotate(-30 36 30)"/>` +
  `</svg>`);

// ---------- 상태 ----------
const layer = document.getElementById('layer');
const board = document.getElementById('board');
const $ = id => document.getElementById(id);
let cell = 56;
let grid = [];          // grid[r][c] = {t, el, r, c}
let busy = false;       // 애니메이션 중이면 입력 막기
let playing = false;
let score = 0;
let best = 0;
let timeLeft = GAME_SEC;
let timerId = null;
let selected = null;
let gameNo = 0;         // 새 게임을 누르면 이전 게임의 비동기 흐름을 끊는 번호

const sleep = ms => new Promise(res => setTimeout(res, ms));
const rand = n => Math.floor(Math.random() * n);

try { best = Number(localStorage.getItem('gem-best')) || 0; } catch (e) { best = 0; }
$('best').textContent = best;

// ---------- 화면 배치 ----------
function fitCell() {
  const w = Math.min(window.innerWidth - 32, 560) - 16;
  cell = Math.floor(w / N);
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
function place(g, r, c, durSec) {
  g.r = r; g.c = c;
  g.el.style.transitionDuration = durSec ? durSec + 's' : '';
  g.el.style.transform = `translate(${c * cell}px,${r * cell}px)`;
}
function makeGem(t, r, c, startRow) {
  const el = document.createElement('div');
  el.className = 'gem';
  el.innerHTML = SVGS[t];
  const g = { t, el, r, c };
  el._g = g;
  el.style.transition = 'none';
  el.style.transform = `translate(${c * cell}px,${startRow * cell}px)`;
  layer.appendChild(el);
  return g;
}
window.addEventListener('resize', () => {
  fitCell();
  for (const row of grid) for (const g of row) if (g) {
    g.el.style.transition = 'none'; place(g, g.r, g.c);
  }
  void layer.offsetHeight;
  for (const row of grid) for (const g of row) if (g) g.el.style.transition = '';
});

// ---------- 판 규칙 ----------
// 종류 배열 t에서 (r,c)를 포함한 3개 이상 줄이 있는가
function lineAt(t, r, c) {
  const x = t[r][c];
  let h = 1, v = 1;
  for (let k = c - 1; k >= 0 && t[r][k] === x; k--) h++;
  for (let k = c + 1; k < N && t[r][k] === x; k++) h++;
  for (let k = r - 1; k >= 0 && t[k][c] === x; k--) v++;
  for (let k = r + 1; k < N && t[k][c] === x; k++) v++;
  if (h >= 3 || v >= 3) return true;
  // (r,c)를 한 모서리로 하는 2×2 사각형 4가지
  for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
    const r0 = r + dr, c0 = c + dc;
    if (r0 < 0 || c0 < 0 || r0 + 1 >= N || c0 + 1 >= N) continue;
    if (t[r0][c0] === x && t[r0][c0 + 1] === x && t[r0 + 1][c0] === x && t[r0 + 1][c0 + 1] === x) return true;
  }
  return false;
}
function types() { return grid.map(row => row.map(g => g.t)); }

// 바꾸면 줄이 생기는 한 수를 찾는다(없으면 null)
function findMove() {
  const t = types();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N || t[r][c] === t[r2][c2]) continue;
      [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
      const ok = lineAt(t, r, c) || lineAt(t, r2, c2);
      [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
      if (ok) return [grid[r][c], grid[r2][c2]];
    }
  }
  return null;
}

// 지금 판에서 사라질 보석들
function findMatches() {
  const s = new Set();
  for (let r = 0; r < N; r++) {
    let run = 1;
    for (let c = 1; c <= N; c++) {
      if (c < N && grid[r][c].t === grid[r][c - 1].t) run++;
      else { if (run >= 3) for (let k = c - run; k < c; k++) s.add(grid[r][k]); run = 1; }
    }
  }
  for (let c = 0; c < N; c++) {
    let run = 1;
    for (let r = 1; r <= N; r++) {
      if (r < N && grid[r][c].t === grid[r - 1][c].t) run++;
      else { if (run >= 3) for (let k = r - run; k < r; k++) s.add(grid[k][c]); run = 1; }
    }
  }
  // 2×2 사각형
  s.square = false;
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    const x = grid[r][c].t;
    if (grid[r][c + 1].t === x && grid[r + 1][c].t === x && grid[r + 1][c + 1].t === x) {
      s.add(grid[r][c]); s.add(grid[r][c + 1]); s.add(grid[r + 1][c]); s.add(grid[r + 1][c + 1]);
      s.square = true;
    }
  }
  return s;
}

// 처음부터 줄이 없고, 둘 수 있는 수가 있는 종류 배열
function freshTypes() {
  for (;;) {
    const t = [];
    for (let r = 0; r < N; r++) {
      t.push([]);
      for (let c = 0; c < N; c++) {
        let x;
        do { x = rand(TYPES); }
        while ((c >= 2 && t[r][c - 1] === x && t[r][c - 2] === x) ||
               (r >= 2 && t[r - 1][c] === x && t[r - 2][c] === x) ||
               (r >= 1 && c >= 1 && t[r - 1][c] === x && t[r][c - 1] === x && t[r - 1][c - 1] === x));
        t[r].push(x);
      }
    }
    // 둘 수 있는 수 확인
    const saved = grid;
    grid = t.map(row => row.map(x => ({ t: x })));
    const ok = findMove() !== null;
    grid = saved;
    if (ok) return t;
  }
}

// ---------- 진행 ----------
function setScore(v) {
  score = Math.max(0, v);
  $('score').textContent = score;
}
function floatText(txt) {
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = txt;
  board.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

function swapCells(a, b) {
  const ar = a.r, ac = a.c;
  grid[b.r][b.c] = a;
  grid[ar][ac] = b;
  place(a, b.r, b.c);
  place(b, ar, ac);
}

async function trySwap(a, b) {
  if (busy || !playing) return;
  if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
  busy = true;
  const myGame = gameNo;
  clearHint();
  swapCells(a, b);
  await sleep(230);
  if (myGame !== gameNo) return;
  const m = findMatches();
  if (m.size === 0) {
    swapCells(a, b);           // 줄이 안 생기면 되돌린다
    await sleep(230);
  } else {
    await resolve(m, myGame);
  }
  if (myGame === gameNo) busy = false;
}

async function resolve(m, myGame) {
  let combo = 1;
  while (m.size) {
    for (const g of m) { g.el.classList.add('pop'); grid[g.r][g.c] = null; }
    const bonus = m.size >= 5 ? 2 : m.size === 4 ? 1.5 : 1;
    setScore(score + Math.round(m.size * 10 * combo * bonus));
    if (combo > 1) floatText(`콤보 x${combo}!`);
    else if (m.square) floatText('사각형!');
    else if (m.size >= 5) floatText('대단해요!');
    await sleep(220);
    if (myGame !== gameNo) return;
    for (const g of m) g.el.remove();
    const wait = gravity();
    await sleep(wait);
    if (myGame !== gameNo) return;
    m = findMatches();
    combo++;
  }
  if (!findMove()) {
    floatText('섞는 중…');
    await sleep(500);
    if (myGame !== gameNo) return;
    reshuffle();
    await sleep(300);
  }
}

// 빈칸 위 보석을 떨어뜨리고 새 보석을 채운다. 걸리는 시간(ms)을 돌려준다.
function gravity() {
  let maxDur = 0;
  const born = [];
  for (let c = 0; c < N; c++) {
    let write = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (!g) continue;
      if (r !== write) {
        grid[write][c] = g; grid[r][c] = null;
        const d = 0.1 + 0.06 * (write - r);
        maxDur = Math.max(maxDur, d);
        place(g, write, c, d);
      }
      write--;
    }
    const missing = write + 1;
    for (let r = write; r >= 0; r--) {
      const g = makeGem(rand(TYPES), r, c, r - missing);
      grid[r][c] = g;
      born.push([g, 0.1 + 0.06 * missing]);
      maxDur = Math.max(maxDur, 0.1 + 0.06 * missing);
    }
  }
  void layer.offsetHeight;  // 시작 위치를 먼저 그리게 한다
  for (const [g, d] of born) { g.el.style.transition = ''; place(g, g.r, g.c, d); }
  return maxDur * 1000 + 40;
}

function reshuffle() {
  const t = freshTypes();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    grid[r][c].t = t[r][c];
    grid[r][c].el.innerHTML = SVGS[t[r][c]];
  }
}

// ---------- 힌트 ----------
let hintTimer = null;
function clearHint() {
  clearTimeout(hintTimer);
  layer.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'));
}
function showHint() {
  if (busy || !playing) return;
  const mv = findMove();
  if (!mv) return;
  clearHint();
  setScore(score - 50);
  mv.forEach(g => g.el.classList.add('hint'));
  hintTimer = setTimeout(clearHint, 2200);
}

// ---------- 입력: 끌기 + 두 번 누르기 ----------
let drag = null;
function select(g) {
  if (selected) selected.el.classList.remove('sel');
  selected = g;
  if (g) g.el.classList.add('sel');
}
layer.addEventListener('pointerdown', e => {
  const el = e.target.closest('.gem');
  if (!el || busy || !playing) return;
  drag = { g: el._g, x: e.clientX, y: e.clientY };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * 0.35) return;
  const g = drag.g;
  drag = null;
  let r = g.r, c = g.c;
  if (Math.abs(dx) > Math.abs(dy)) c += dx > 0 ? 1 : -1; else r += dy > 0 ? 1 : -1;
  select(null);
  if (r >= 0 && r < N && c >= 0 && c < N) trySwap(g, grid[r][c]);
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  const g = drag.g;
  drag = null;
  if (!selected) { select(g); return; }
  if (selected === g) { select(null); return; }
  const a = selected;
  if (Math.abs(a.r - g.r) + Math.abs(a.c - g.c) === 1) { select(null); trySwap(a, g); }
  else select(g);
});

// ---------- 시간 ----------
function tick() {
  timeLeft = Math.max(0, timeLeft - 0.1);
  $('time').textContent = Math.ceil(timeLeft);
  $('timefill').style.width = (timeLeft / GAME_SEC * 100) + '%';
  $('timebar').classList.toggle('low', timeLeft <= 10);
  if (timeLeft <= 0) endGame();
}
async function endGame() {
  clearInterval(timerId);
  playing = false;
  select(null); clearHint();
  const myGame = gameNo;
  while (busy) { await sleep(50); if (myGame !== gameNo) return; }  // 연쇄가 끝난 뒤 점수 확정
  const newBest = score > best;
  if (newBest) {
    best = score;
    $('best').textContent = best;
    try { localStorage.setItem('gem-best', String(best)); } catch (e) { /* 저장 못 해도 게임은 계속 */ }
  }
  $('overScore').textContent = `점수 ${score}점` + (newBest ? ' · 최고 기록!' : '');
  $('over').classList.add('show');
}

function newGame() {
  gameNo++;
  clearInterval(timerId);
  busy = false; drag = null; select(null); clearHint();
  $('over').classList.remove('show');
  layer.innerHTML = '';
  fitCell();
  setScore(0);
  timeLeft = GAME_SEC;
  const t = freshTypes();
  grid = [];
  for (let r = 0; r < N; r++) {
    grid.push([]);
    for (let c = 0; c < N; c++) grid[r].push(makeGem(t[r][c], r, c, r - N));
  }
  void layer.offsetHeight;
  for (const row of grid) for (const g of row) { g.el.style.transition = ''; place(g, g.r, g.c, 0.35 + g.r * 0.03); }
  playing = true;
  tick();
  timerId = setInterval(tick, 100);
}

$('newBtn').onclick = newGame;
$('again').onclick = newGame;
$('hintBtn').onclick = showHint;
newGame();
</script>
</body>
</html>
